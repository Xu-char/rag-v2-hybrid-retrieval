# Milvus 3.0.1 单机版（standalone）+ Attu 可视化界面
# 基于官方 milvus-standalone-docker-compose.yml（v3.0.1），只做了两处改动：
#   1) 加了 attu 服务，省得另外 docker run
#   2) 去掉了已废弃的 version 字段，并显式声明项目名
#
# 用法（在本目录下打开终端）：
#   docker compose up -d          # 启动 etcd + minio + milvus + attu
#   docker compose ps             # 看状态
#   docker compose logs -f standalone
#   docker compose down           # 停止（数据保留在 .\volumes）
#   docker compose down -v        # 停止并删数据卷
#
# 端口：
#   19530  Milvus gRPC（pymilvus / langchain-milvus 连这个）
#   9091   Milvus 健康检查 / 指标
#   9000    MinIO S3 API，9001 MinIO 控制台（minioadmin / minioadmin）
#   8000   Attu 可视化界面 -> http://localhost:8000
#
# 数据落盘位置：.\volumes\{etcd,minio,milvus}
name: milvus

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker          # 3.x 内置 WAL，不再依赖 pulsar/kafka
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # 向量数据库可视化：浏览器打开 http://localhost:8000
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v3.0.0
    environment:
      # v3.0 的变量名是 MILVUS_ADDRESS（v2.x 才叫 MILVUS_URL，写错会连不上）
      MILVUS_ADDRESS: milvus-standalone:19530
      MILVUS_NAME: local-milvus
      # Attu v3 默认开启自己的登录（首次访问要注册管理员）。
      # 本地开发 + Milvus 也没开认证，这里直接关掉登录，打开即用。
      # 想恢复登录：删掉这一行，重建容器，然后首次访问时注册管理员。
      ATTU_AUTH_MODE: none
    ports:
      - "8000:3000"      # 容器内是 3000，映射到宿主机 8000
    volumes:
      - attu_data:/data  # 保存连接配置、偏好设置
    depends_on:
      - "standalone"
    restart: unless-stopped

networks:
  default:
    name: milvus

volumes:
  attu_data:
